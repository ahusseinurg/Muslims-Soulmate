name: Build and publish signed Android beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  release:
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/muslimate-release.jks
          cat > mobile/android/keystore.properties <<EOF
          storeFile=muslimate-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p mobile/android assembleRelease
      - name: Publish update package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(grep -oE 'versionCode [0-9]+' mobile/android/app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -oE "versionName '[^']+'" mobile/android/app/build.gradle | cut -d"'" -f2)
          mkdir -p downloads
          cp mobile/android/app/build/outputs/apk/release/app-release.apk downloads/Muslimate-Android-Beta.apk
          sha256sum downloads/Muslimate-Android-Beta.apk > downloads/SHA256SUMS
          cat > downloads/update.json <<EOF
          {"version_code": $VERSION_CODE, "version_name": "$VERSION_NAME", "apk_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION_NAME/Muslimate-Android-Beta.apk", "required": false}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads
          git commit -m "Publish Android beta $VERSION_NAME" || true
          git push
          gh release create "v$VERSION_NAME" downloads/Muslimate-Android-Beta.apk downloads/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Muslimate Android $VERSION_NAME" --generate-notes || gh release upload "v$VERSION_NAME" downloads/Muslimate-Android-Beta.apk downloads/SHA256SUMS --clobber

# Release workflow enabled after signing secrets were added.
