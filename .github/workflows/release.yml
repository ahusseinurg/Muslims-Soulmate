name: Publish signed Android beta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'downloads/Muslims-Soulmate-Android-Beta.apk'
      - 'downloads/SHA256SUMS'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged APK checksum
        working-directory: downloads
        run: sha256sum --check SHA256SUMS
      - name: Publish or update beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0-beta >/dev/null 2>&1; then
            gh release upload v0.4.0-beta downloads/Muslims-Soulmate-Android-Beta.apk downloads/SHA256SUMS --clobber
          else
            gh release create v0.4.0-beta downloads/Muslims-Soulmate-Android-Beta.apk downloads/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title 'Muslims Soulmate Android 0.4.0 beta' --notes-file RELEASE-NOTES.md
          fi
